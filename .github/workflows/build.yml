      - name: Compilar
        working-directory: proj
        env:
          KS_B64: ${{ secrets.JARVIS_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.JARVIS_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$PWD/jarvis.p12"
            export JARVIS_KS_FILE="$PWD/jarvis.p12" JARVIS_KS_PASS="$KS_PASS" JARVIS_KS_ALIAS=jarvis
            gradle assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../Jarvis.apk
            echo "APK assinado com a chave FIXA: instala por cima do app ja instalado."
          else
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../Jarvis.apk
            echo "AVISO: sem chave fixa (segredos JARVIS_KEYSTORE_B64 e JARVIS_KEYSTORE_PASSWORD). Assinatura de teste: so instala se desinstalar o app antes."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: Jarvis.apk

      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Jarvis APK
          files: Jarvis.apk
